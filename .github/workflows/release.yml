name: Release

# A version tag runs the CI checks, builds the Windows and Linux installers,
# installs the Linux packages on several distros, then uploads the
# installers to the download server and makes the GitHub release once
# everything passed. The builds only keep their files as workflow
# artifacts, so the release is made once, by the publish job. A manual run
# does all of it but the upload and the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # What the release says, on GitHub and in the updater.
  RELEASE_NOTES: The changes in this version are in the changelog at https://vaultime.codfishcloud.de/changelog.html.

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  windows:
    name: Build (Windows)
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          # Caches saved by a tag run only that tag could restore.
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Updater artifacts need the signing key. Tagged releases require it so
      # installed apps can verify updates. Manual runs build without it.
      - name: Check updater signing key
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret before tagging a release."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ steps.signing.outputs.args }}

      - name: Keep installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultime-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe*
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi*
          if-no-files-found: error

  linux:
    name: Build (Linux)
    needs: checks
    runs-on: ubuntu-24.04
    # The oldest supported base keeps the glibc floor at 2.35, so the packages
    # run on Debian 12, Fedora, Arch, openSUSE and newer Ubuntu as well.
    container: ubuntu:22.04
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      # AppImage tools cannot mount FUSE inside a container.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: bash packaging/linux/install-build-deps.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
          # Caches saved by a tag run only that tag could restore.
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check updater signing key
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret before tagging a release."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ steps.signing.outputs.args }}

      - name: Keep packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vaultime-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb*
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm*
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error

  linux-smoke:
    name: Smoke test (${{ matrix.image }})
    needs: linux
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            package: deb
          - image: ubuntu:24.04
            package: deb
          - image: fedora:latest
            package: rpm
          - image: archlinux:latest
            package: AppImage
          - image: opensuse/tumbleweed
            package: AppImage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: packaging/linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vaultime-linux
          path: pkg

      - name: Install and start the app
        # The artifact keeps the deb, rpm and appimage folders. A glob works
        # on minimal images without find.
        run: |
          shopt -s globstar nullglob
          packages=(pkg/**/*.${{ matrix.package }})
          bash packaging/linux/smoke-test.sh "${packages[0]}"

  publish:
    name: Publish release
    needs: [windows, linux, linux-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Public host key of the download server.
      KNOWN_HOST: vaultime.codfishcloud.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEwdueLrdL1ZgF5dR8eOO48VWq/Zi46bFk7uBLJZ/8Is
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts
            apps/desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vaultime-*
          path: artifacts

      # The artifacts keep the bundle folders, the script wants one.
      - name: Gather the installers
        run: |
          mkdir release
          find artifacts -type f -exec mv -t release {} +
          ls -l release

      # A tag publishes its own version, a manual run checks the version it
      # built.
      - name: Check the release files
        if: github.ref_type != 'tag'
        env:
          VAULTIME_RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        run: bash scripts/publish-downloads.sh --check "$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" release

      # Installed apps look for updates on the download server, so the
      # release is only made once its files are there.
      - name: Upload to the download server
        if: github.ref_type == 'tag'
        env:
          SSH_KEY: ${{ secrets.VAULTIME_RELEASE_SSH_KEY }}
          VAULTIME_RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Add the VAULTIME_RELEASE_SSH_KEY secret before tagging a release."
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release
          chmod 0600 ~/.ssh/release
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          export RSYNC_RSH="ssh -i $HOME/.ssh/release -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          bash scripts/publish-downloads.sh "$GITHUB_REF_NAME" release

      # A rerun finds the release of an earlier try and fills it in.
      - name: Make the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Vaultime $GITHUB_REF_NAME" --notes "$RELEASE_NOTES"
          fi
