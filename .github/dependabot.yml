version: 2

# Monthly grouped update PRs keep dependencies current without daily noise.
# Prefixes keep the `module: message` commit format.
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    commit-message:
      prefix: desktop/ui
    ignore:
      # Types follow the Node LTS used in CI, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1. Drop this once it
      # supports newer versions.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
    commit-message:
      prefix: desktop
    groups:
      desktop-crates:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /apps/api
    schedule:
      interval: monthly
    commit-message:
      prefix: api
    groups:
      api-crates:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
