[package]
name = "vaultime"
version = "0.1.0"
description = "Universal game library and trustworthy playtime tracker"
authors = ["schwimmbeck"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "vaultime_lib"

[build-dependencies]
tauri-build = "2.7"

[dependencies]
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = "0.4"
dirs = "7"
getrandom = "0.4"
hmac = "0.13"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
keyring = "4.2"
log = "0.4"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
libloading = "0.9"
x11rb = { version = "0.14", features = ["screensaver", "xinput"] }
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# MSVC prints "creating library" notes when it links the app and test binaries. They are not problems.
linker_messages = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Tauri commands take owned arguments.
needless_pass_by_value = "allow"
# IPC commands return Result even when they cannot fail.
unnecessary_wraps = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
